name: AudioCastMac
options:
  bundleIdPrefix: com.audiocast
targets:
  AudioCastMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: Sources
    info:
      path: Info.plist
      properties:
        CFBundleName: AudioCastMac
        CFBundleIdentifier: com.audiocast.AudioCastMac
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSScreenCaptureUsageDescription: "AudioCast needs screen recording permissions to capture system audio."
        NSMicrophoneUsageDescription: "AudioCast needs microphone access for audio capture."
        NSLocalNetworkUsageDescription: "AudioCast needs access to your local network to stream audio to your devices."
        NSBonjourServices:
          - _audiocast._tcp
